name: Release

# Publishes com.wajub:wajub-java to Maven Central when a vX.Y.Z tag is pushed.
# The tag must match the version in pom.xml.
#
# Repository secrets:
#   CENTRAL_USERNAME, CENTRAL_PASSWORD  user token from central.sonatype.com
#                                       (account that owns the com.wajub namespace)
#   GPG_PRIVATE_KEY                     armored secret key that signs the artifacts;
#                                       its public key must be on keyserver.ubuntu.com
#   GPG_PASSPHRASE                      that key's passphrase

on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
          server-id: central
          server-username: CENTRAL_USERNAME
          server-password: CENTRAL_PASSWORD
          gpg-private-key: ${{ secrets.GPG_PRIVATE_KEY }}
          gpg-passphrase: MAVEN_GPG_PASSPHRASE
      - name: Check the tag matches pom.xml
        run: |
          version=$(./mvnw -B -q help:evaluate -Dexpression=project.version -DforceStdout)
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match pom.xml version $version" >&2
            exit 1
          fi
      - name: Test, sign and publish
        run: ./mvnw -B deploy
        env:
          CENTRAL_USERNAME: ${{ secrets.CENTRAL_USERNAME }}
          CENTRAL_PASSWORD: ${{ secrets.CENTRAL_PASSWORD }}
          MAVEN_GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
